name: Akcio Vadasz Feldolgozo (GPT Vision)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Akcios Ujsag Linkvadasz (Automata)"]
    types:
      - completed
permissions:
  contents: write
jobs:
  process_flyers:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Kod letoltese
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Python telepitese
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Programok telepitese
        run: |
          pip install requests beautifulsoup4 selenium webdriver-manager openai python-dotenv curl_cffi PyMuPDF google-cloud-vision
      - name: Google Chrome telepitese
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - name: Google credentials beallitasa
        env:
          GCLOUD_KEY: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_key.json
        run: |
          echo "$GCLOUD_KEY" > /tmp/google_key.json
      - name: Akciovadasz Robot Inditasa
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_key.json
        run: python flyer_processor_bot.py
      - name: Eredmeny mentese
        run: |
          git config --global user.name "AkcioVadaszBot"
          git config --global user.email "bot@akciovadasz.hu"
          git add assets/universal_output.json
          git commit -m "Uj termekek feldolgozva (AI) - $(date)" || echo "Nincs uj adat."
          git pull --rebase origin main
          git push
