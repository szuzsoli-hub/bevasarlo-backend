name: Akcios Ujsag Linkvadasz (Automata)
on:
  schedule:
    - cron: '13 4,10,16 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Kod letoltese
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Python beallitasa
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Chrome telepitese
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - name: Fuggosegek telepitese
        run: |
          pip install -r requirements.txt
      - name: Master Scanner futtatasa
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python master_scanner.py
      - name: JSON feltoltese
        run: |
          git config --global user.name 'AkcioRobot'
          git config --global user.email 'robot@github.com'
          mkdir -p assets
          mv flyers.json assets/flyers.json
          git add assets/flyers.json
          git commit -m "Friss ujsag linkek: $(date)" || echo "Nincs valtozas"
          git pull --rebase origin main
          git push
